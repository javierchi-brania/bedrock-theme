<!-- Bedrock theme: Marca Blanca → JS personalizado. Paste this whole file into the field.
     Landing pages: the platform opens the agency launchpad when switching to the agency
     and the sub-account launchpad ("Panel") when switching to a sub-account. A guard on the
     page router sends both to the dashboard before the launchpad renders (no reload, no
     flash, the launchpad does not stay in the back history). If the router is not found,
     nothing changes. -->
<script>
(function () {
  if (window.__bbLandingRedirect) return;
  window.__bbLandingRedirect = true;

  function target(path) {
    if (/^\/agency_launchpad\/?$/.test(path)) return '/agency_dashboard';
    var m = path.match(/^(\/v2\/location\/[^/]+)\/launchpad\/?$/);
    return m ? m[1] + '/dashboard' : null;
  }

  var tries = 0;
  (function install() {
    var el = document.querySelector('#app');
    var app = el && el.__vue_app__;
    var router = app && app.config.globalProperties.$router;
    if (!router) {
      if (++tries < 80) setTimeout(install, 250);
      return;
    }
    router.beforeEach(function (to) {
      var dest = target(to.path);
      return dest ? { path: dest, replace: true } : true;
    });
    // On a full page load the first navigation may already be past the guards when this
    // runs: once the router is ready, a launchpad still on screen is replaced.
    router.isReady().then(function () {
      var now = target(router.currentRoute.value.path);
      if (now) router.replace(now);
    });
  })();
})();
</script>
