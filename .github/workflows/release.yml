name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      CDN_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/dist/bedrock-theme.css
      PURGE_URL: https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/dist/bedrock-theme.css
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and verify dist/ is up to date
        run: npm run check | tee build.txt

      - name: Version in package.json and embed/editor.css matches the tag
        run: |
          PKG="v$(node -p 'require("./package.json").version')"
          [ "$PKG" = "$TAG" ] || { echo "::error::package.json is $PKG, tag is $TAG"; exit 1; }
          grep -qF "bedrock-theme@$TAG/dist/bedrock-theme.css" embed/editor.css \
            || { echo "::error::embed/editor.css does not import @$TAG"; exit 1; }

      - name: Release notes
        run: |
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## Install"
            echo
            echo 'In the custom CSS field, change only the version in the `@import` and save:'
            echo
            echo '```css'
            echo "@import url(\"$CDN_URL\");"
            echo '```'
            echo
            echo "Build: $(sed 's/^✔ //' build.txt | tail -1)"
            echo
            if [ -n "$PREV" ]; then node scripts/rules-diff.mjs --base "$PREV"; fi
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        run: gh release create "$TAG" dist/bedrock-theme.css --title "$TAG" --notes-file notes.md --generate-notes --verify-tag

      - name: Purge jsDelivr cache
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "$PURGE_URL"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::purge request failed"; exit 1

      - name: Verify jsDelivr serves the tag (200 text/css, same bytes)
        run: |
          EXPECTED="$(sha256sum dist/bedrock-theme.css | cut -d' ' -f1)"
          for i in $(seq 1 18); do
            META="$(curl -sS -o served.css -w '%{http_code} %{content_type}' "$CDN_URL" || true)"
            GOT="$(sha256sum served.css 2>/dev/null | cut -d' ' -f1)"
            echo "attempt $i: $META sha256=$GOT"
            case "$META" in
              "200 text/css"*) [ "$GOT" = "$EXPECTED" ] && { echo "✔ $CDN_URL"; exit 0; } ;;
            esac
            sleep 10
          done
          echo "::error::$CDN_URL did not serve the expected CSS"; exit 1
