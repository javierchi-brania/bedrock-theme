name: ci

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails if the CSS does not parse, the manifest is out of sync,
      # a vendor name leaks, or dist/ was not rebuilt.
      - name: Build and verify dist/ is up to date
        run: npm run check

      - name: Rules diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git describe --tags --abbrev=0)"
          fi
          node scripts/rules-diff.mjs --base "$BASE" --out rules-diff.md > /dev/null
          cat rules-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post rules diff on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rules-diff -->';
            const body = `${marker}\n${fs.readFileSync('rules-diff.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
